volumes:
  pg_legal_sync_data:

services:
  db:
    image: postgres:16-alpine
    # Значения берутся из .env; в БД передаются только её собственные настройки.
    environment:
      POSTGRES_DB: ${POSTGRES_NAME:?Set POSTGRES_NAME in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - pg_legal_sync_data:/var/lib/postgresql/data

  legal_sync_service:
    build: .
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2GB
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${LEGAL_SYNC_PORT:?Set LEGAL_SYNC_PORT in .env}:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1${API_V1_PREFIX:?Set API_V1_PREFIX in .env}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      legal_sync_service:
        condition: service_healthy
