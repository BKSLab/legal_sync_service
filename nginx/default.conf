upstream legal_sync_backend {
    zone legal_sync_backend 64k;
    # Docker DNS: обновлять адрес после пересоздания контейнера приложения.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server legal_sync_service:8000 resolve;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 10m;

    location / {
        proxy_pass http://legal_sync_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Сохранять внешний порт в ссылках и перенаправлениях админки.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        proxy_connect_timeout 5s;
        # Ручной мониторинг и отправка очереди ожидают внешние сервисы.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
